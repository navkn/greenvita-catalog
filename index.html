            <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
                <img id="brandLogo" src="" alt="GreenVita Logo" class="h-8 w-8 sm:h-10 sm:w-10 object-cover bg-white rounded-full hidden shadow-sm border border-purple-300">
                <div class="flex flex-col">
                    <h1 class="text-[12px] sm:text-xl font-bold tracking-tight leading-tight whitespace-nowrap">GreenVita<br class="sm:hidden">AgroTech</h1>
                    <span class="hidden sm:block text-[10px] sm:text-xs font-medium text-purple-200 tracking-wider uppercase">Product Catalogue</span>
                </div>
            </div>
            
            
            <div class="flex-grow w-full max-w-2xl px-1 sm:px-0">
                <div class="relative w-full group">
                    <svg class="absolute left-2.5 sm:left-3 top-1/2 transform -translate-y-1/2 w-3.5 h-3.5 sm:w-5 sm:h-5 text-gray-500 group-focus-within:text-purple-700 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search..." class="w-full pl-8 sm:pl-10 pr-3 sm:pr-4 py-1.5 sm:py-2 text-[13px] sm:text-base text-gray-900 bg-white/95 focus:bg-white rounded-full border-none focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-inner placeholder-gray-500 transition-all">
                </div>
            </div>
            
            
            <div class="flex items-center gap-1.5 sm:gap-4 flex-shrink-0">
                <a id="igLink" href="#" target="_blank" class="hidden flex items-center justify-center w-7 h-7 sm:w-10 sm:h-10 bg-white rounded-full shadow-md hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 sm:w-6 sm:h-6" viewBox="0 0 24 24">
                        <defs><radialGradient id="ig-grad" r="150%" cx="30%" cy="107%"><stop stop-color="#fdf497" offset="0"></stop><stop stop-color="#fdf497" offset="0.05"></stop><stop stop-color="#fd5949" offset="0.45"></stop><stop stop-color="#d6249f" offset="0.6"></stop><stop stop-color="#285AEB" offset="0.9"></stop></radialGradient></defs>
                        <path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                </a>
                <a id="ytLink" href="#" target="_blank" class="hidden flex items-center justify-center w-7 h-7 sm:w-10 sm:h-10 bg-white rounded-full shadow-md hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 sm:w-6 sm:h-6" viewBox="0 0 24 24">
                        <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path fill="#ffffff" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </a>
            </div>
        </div>

        
        <nav class="flex overflow-x-auto hide-scroll px-3 sm:px-4 py-2 space-x-2 bg-white shadow-sm border-b border-gray-100" id="tabContainer"></nav>
    </header>

    <main class="p-3 sm:p-4 pb-32 sm:pb-32" id="mainContainer"></main>

    
    <div id="floatingCart" class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 sm:w-[350px] bg-purple-900 text-white p-3 sm:p-4 rounded-2xl shadow-[0_10px_25px_rgba(0,0,0,0.3)] transform translate-y-48 opacity-0 transition-all duration-300 z-40 flex justify-between items-center border border-purple-700 pointer-events-none">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-400 text-purple-900 font-black rounded-full w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center shadow-inner text-lg" id="cartCount">0</div>
            <div class="flex flex-col">
                <span class="font-bold text-sm sm:text-base leading-tight">Items in Order</span>
                <span class="text-[10px] sm:text-xs text-purple-200 uppercase tracking-wide">Review & Send</span>
            </div>
        </div>
        <button onclick="openModal()" class="bg-white text-purple-900 px-4 py-2.5 sm:px-5 sm:py-3 rounded-xl font-black text-sm sm:text-base hover:bg-gray-100 transition-colors shadow-md">
            View Order
        </button>
    </div>

    
    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full sm:w-[500px] sm:rounded-2xl rounded-t-3xl shadow-2xl flex flex-col max-h-[85vh] modal-enter">
            
            <div class="p-4 sm:p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl sm:rounded-t-2xl">
                <h2 class="text-xl font-black text-gray-800">Order Summary</h2>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold transition-colors">&times;</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-grow" id="orderItemsList"></div>
            
            <div class="p-4 sm:p-5 border-t bg-gray-50 rounded-b-2xl">
                <div class="flex justify-between items-end mb-4">
                    <span class="font-bold text-gray-600 uppercase tracking-wide text-xs sm:text-sm">Total Estimate:</span>
                    <span class="font-black text-2xl text-purple-900" id="modalTotal">₹0</span>
                </div>
                <button onclick="sendOrderViaWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-black py-3.5 rounded-xl shadow-md transition-colors flex justify-center items-center gap-2 text-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                    Send Order to WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        
        function getProductBySku(sku) {
            let p = DATA.products.find(x => x.sku === sku);
            if (p) return p;
            return DATA.bundles.find(x => x.sku === sku);
        }

        function parsePrice(str) { return parseFloat(str.toString().replace(/[^0-9.]/g, '')) || 0; }
        function formatCurrency(num) { return '₹' + num.toLocaleString('en-IN'); }

        function getImageUrl(item) {
            if (!item.driveId) return "https://via.placeholder.com/400?text=No+Image";
            return window.location.hostname.includes("googleusercontent.com") 
                ? "https://drive.google.com/thumbnail?id=" + item.driveId + "&sz=w1000" 
                : "./images/" + item.sku + ".jpg";
        }

        
        function updateQty(sku, delta) {
            if (!window.CART[sku] && delta > 0) {
                const item = getProductBySku(sku);
                const price = item.price.toString().startsWith('₹') ? item.price : '₹' + item.price;
                window.CART[sku] = { name: item.name, price: price, qty: 1 };
            } else if (window.CART[sku]) {
                window.CART[sku].qty += delta;
                if (window.CART[sku].qty <= 0) delete window.CART[sku];
            }
            
            const ctrlContainer = document.getElementById('ctrl-' + sku);
            if (ctrlContainer) ctrlContainer.innerHTML = getControlsHtml(sku);
            
            updateFloatingCart();
        }

        function getControlsHtml(sku) {
            const qty = window.CART[sku] ? window.CART[sku].qty : 0;
            const safeSku = sku.replace(/'/g, "\\'");
            
            if (qty === 0) {
                return '<button onclick="updateQty(\'' + safeSku + '\', 1)" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold px-4 py-2 rounded-lg text-sm sm:text-base transition-colors border border-purple-200 shadow-sm whitespace-nowrap">+ Add</button>';
            } else {
                return '<div class="flex items-center bg-white border border-purple-300 rounded-lg overflow-hidden shadow-sm h-9 sm:h-11">' +
                    '<button onclick="updateQty(\'' + safeSku + '\', -1)" class="w-9 sm:w-11 h-full bg-purple-50 hover:bg-purple-100 text-purple-700 font-black flex items-center justify-center transition-colors text-lg">-</button>' +
                    '<span class="w-8 sm:w-10 text-center font-bold text-purple-900 text-sm sm:text-base">' + qty + '</span>' +
                    '<button onclick="updateQty(\'' + safeSku + '\', 1)" class="w-9 sm:w-11 h-full bg-purple-50 hover:bg-purple-100 text-purple-700 font-black flex items-center justify-center transition-colors text-lg">+</button>' +
                '</div>';
            }
        }

        function updateFloatingCart() {
            let totalItems = 0;
            for (let sku in window.CART) totalItems += window.CART[sku].qty;
            
            const fab = document.getElementById('floatingCart');
            const countEl = document.getElementById('cartCount');
            
            if (totalItems > 0) {
                countEl.innerText = totalItems;
                fab.classList.remove('translate-y-48', 'opacity-0', 'pointer-events-none');
            } else {
                fab.classList.add('translate-y-48', 'opacity-0', 'pointer-events-none');
                closeModal(); 
            }
        }

        
        function openModal() {
            const listEl = document.getElementById('orderItemsList');
            let html = '';
            let grandTotal = 0;

            for (let sku in window.CART) {
                const item = window.CART[sku];
                const unitPrice = parsePrice(item.price);
                const lineTotal = unitPrice * item.qty;
                grandTotal += lineTotal;

                html += '<div class="flex justify-between items-center py-3 border-b border-gray-100">' +
                            '<div class="flex flex-col">' +
                                '<span class="font-bold text-gray-800 text-sm sm:text-base leading-tight pr-4">' + item.name + '</span>' +
                                '<span class="text-xs text-gray-500 font-medium mt-0.5">' + formatCurrency(unitPrice) + ' &times; ' + item.qty + '</span>' +
                            '</div>' +
                            '<span class="font-black text-purple-900">' + formatCurrency(lineTotal) + '</span>' +
                        '</div>';
            }

            listEl.innerHTML = html;
            document.getElementById('modalTotal').innerText = formatCurrency(grandTotal);
            document.getElementById('orderModal').classList.remove('hidden');
            document.getElementById('orderModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
            document.getElementById('orderModal').classList.remove('flex');
        }

        function sendOrderViaWhatsApp() {
            let text = "*New Order Inquiry*\n\n```text\n";
            text += "Item            Qty  Total\n";
            text += "--------------------------\n";
            
            let grandTotal = 0;
            for (let sku in window.CART) {
                const item = window.CART[sku];
                const unitPrice = parsePrice(item.price);
                const lineTotal = unitPrice * item.qty;
                grandTotal += lineTotal;
                
                let pName = item.name.substring(0, 14);
                if (item.name.length > 14) pName = item.name.substring(0, 12) + "..";
                pName = pName.padEnd(15, " ");
                
                let qtyStr = item.qty.toString().padEnd(4, " ");
                let totalStr = lineTotal.toString();
                
                text += pName + qtyStr + totalStr + "\n";
            }
            
            text += "--------------------------\n";
            text += "TOTAL:".padEnd(19, " ") + grandTotal.toString() + "\n";
            text += "```\n\nPlease confirm availability and final pricing.";
            
            window.open("https://wa.me/" + DATA.phone + "?text=" + encodeURIComponent(text), "_blank");
        }

        
        function buildCard(item) {
            const displayPrice = item.price.toString().startsWith('₹') ? item.price : '₹' + item.price;
            const safeTitle = item.name.replace(/"/g, '&quot;');
            
            let badgeHtml = '';
            const cleanStatus = item.status ? item.status.toString().trim() : '';
            if (cleanStatus && cleanStatus.toLowerCase() !== 'hide') {
                badgeHtml = '<span class="absolute top-2 right-2 z-10 bg-yellow-400 text-yellow-900 font-black rounded-full shadow-sm uppercase tracking-widest leading-none text-[10px] sm:text-xs px-2.5 py-1 sm:px-3 sm:py-1.5">' + cleanStatus + '</span>';
            }
            
            return '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col product-card transition-transform hover:shadow-md" data-search="' + item.name.toLowerCase() + '">' +
                '<div class="relative pb-[100%] bg-white border-b border-gray-100">' +
                    '<img src="' + getImageUrl(item) + '" alt="' + safeTitle + '" class="absolute top-0 left-0 w-full h-full object-contain p-2 sm:p-4" loading="lazy">' +
                    badgeHtml +
                '</div>' +
                '<div class="flex flex-col flex-grow bg-gray-50 p-3 sm:p-4">' +
                    '<h3 class="font-extrabold text-gray-900 line-clamp-2 text-[15px] sm:text-lg leading-tight mb-2" title="' + safeTitle + '">' + item.name + '</h3>' +
                    '<div class="mt-auto pt-2 flex justify-between items-center gap-1">' +
                        '<span class="font-black text-purple-900 truncate text-base sm:text-xl">' + displayPrice + '</span>' +
                        '<div id="ctrl-' + item.sku + '" class="flex-shrink-0">' +
                            getControlsHtml(item.sku) +
                        '</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function renderApp() {
            if (DATA.logo) { document.getElementById('brandLogo').src = DATA.logo; document.getElementById('brandLogo').classList.remove('hidden'); }
            if (DATA.instagram) { document.getElementById('igLink').href = DATA.instagram; document.getElementById('igLink').classList.remove('hidden'); }
            if (DATA.youtube) { document.getElementById('ytLink').href = DATA.youtube; document.getElementById('ytLink').classList.remove('hidden'); }

            const tabs = document.getElementById('tabContainer');
            const main = document.getElementById('mainContainer');
            
            const gridConfig = 'grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2.5 sm:gap-5';
            
            if (DATA.bundles.length > 0) {
                tabs.innerHTML += '<a href="#section-home" class="tab-link px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-purple-700 text-white shadow-sm" data-target="section-home">Value Bundles</a>';
                main.innerHTML += '<section id="section-home" class="mb-10 sm:mb-12 pt-2 sm:pt-4"><h2 class="text-xl sm:text-2xl font-black text-gray-800 mb-3 sm:mb-4 border-b-2 border-purple-200 pb-2">Value Bundles</h2><div class="grid ' + gridConfig + '">' + DATA.bundles.map(b => buildCard(b)).join('') + '</div></section>';
            }

            DATA.categories.forEach(cat => {
                const safeId = "section-" + cat.replace(/\s+/g, '-').toLowerCase();
                tabs.innerHTML += '<a href="#' + safeId + '" class="tab-link px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors" data-target="' + safeId + '">' + cat + '</a>';
                const catProducts = DATA.products.filter(p => p.category === cat);
                main.innerHTML += '<section id="' + safeId + '" class="mb-10 sm:mb-12 pt-2 sm:pt-4 category-section"><h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-3 sm:mb-4 border-b-2 border-gray-100 pb-2">' + cat + '</h2><div class="grid ' + gridConfig + '">' + catProducts.map(p => buildCard(p)).join('') + '</div></section>';
            });
        }

        
        function setupScrollSpy() {
            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('.tab-link');
            const tabContainer = document.getElementById('tabContainer');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        navLinks.forEach(link => { link.classList.remove('bg-purple-700', 'text-white', 'shadow-sm'); link.classList.add('bg-gray-100', 'text-gray-600'); });
                        const activeTab = document.querySelector('.tab-link[href="#' + entry.target.id + '"]');
                        if (activeTab) { activeTab.classList.remove('bg-gray-100', 'text-gray-600'); activeTab.classList.add('bg-purple-700', 'text-white', 'shadow-sm'); tabContainer.scrollLeft = activeTab.offsetLeft - 10; }
                    }
                });
            }, { rootMargin: '-10% 0px -85% 0px' });
            sections.forEach(sec => observer.observe(sec));
        }

        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', e => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.product-card').forEach(card => {
                    if (card.getAttribute('data-search').includes(term)) card.classList.remove('hidden-card');
                    else card.classList.add('hidden-card');
                });
                document.querySelectorAll('section').forEach(sec => {
                    sec.style.display = sec.querySelectorAll('.product-card:not(.hidden-card)').length === 0 ? 'none' : 'block';
                });
            });
        }

        try { renderApp(); setupScrollSpy(); setupSearch(); } 
        catch (error) { document.getElementById('mainContainer').innerHTML = '<div class="p-6 bg-red-50 text-red-600 rounded-lg border border-red-200 mt-4"><strong>Failed to render catalogue.</strong><br>Error: ' + error.message + '</div>'; }
    </script>
</body>
</html>
